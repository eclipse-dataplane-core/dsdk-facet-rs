# DPS TCK configuration, bind-mounted into the runtime container at /etc/tck/config.properties.
#
# The dataplane URL points back at the host-run siglet via host.docker.internal. Unlike the
# reference SDK (single-participant router), the siglet uses a multi-participant router, so the
# participant_context_id ("siglet") is part of the path. The TCK appends "/dataflows/..." to this
# base. "siglet" also selects the pre-provisioned Vault signing key ("signing-siglet").
dataspacetck.test.package=org.eclipse.dataspacetck.dps.verification.dataplane.http.pull
dataspacetck.dps.dataplane.url=http://host.docker.internal:8081/api/v1/siglet
dataspacetck.dps.dataplane.provider.id=did:web:host.docker.internal%3A8080
dataspacetck.dps.dataplane.counterparty.id=did:web:localhost%3A8083

# --- Synchronous pull (scope of this bootstrap) ---
# Each case's transfer type must match a transfer_type registered in the siglet config
# (see util::build_config -> "http_pull_sync").
