name: Build and Publish Docker Siglet Image

on:
  workflow_dispatch:
  # Reusable entry point: release-siglet.yml calls this with an explicit version so the image
  # is built+pushed (latest + version tags) BEFORE the tag/GitHub Release are created. In this
  # mode github.ref is the caller's ref (main), not a tag, so tags come from inputs.version
  # rather than the ref — see the enable guards in the "Extract metadata" steps.
  workflow_call:
    inputs:
      version:
        description: "Siglet version to tag the image with, e.g. 0.1.0"
        required: true
        type: string
  push:
    branches: [main]
    tags:
      - "siglet-v*"

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}/siglet

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Siglet for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Derive version tags"
        id: ver
        if: ${{ inputs.version != '' }}
        run: |
          v='${{ inputs.version }}'
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "mm=${v%.*}" >> "$GITHUB_OUTPUT"

      - name: "Extract metadata"
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          # Two modes, discriminated by whether a version input was supplied (github.event_name
          # is unreliable here: in a workflow_call it reflects the CALLER's event, not 'workflow_call').
          #  - push/dispatch (no input): tags come from the git ref — dev on main, version from a siglet-v* tag.
          #  - workflow_call (version set): github.ref is the caller's (main), so version + latest
          #    come from inputs.version instead of the ref.
          tags: |
            type=raw,value=dev,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=match,pattern=siglet-v(\d+\.\d+\.\d+),group=1,enable=${{ inputs.version == '' }}
            type=match,pattern=siglet-v(\d+\.\d+),group=1,enable=${{ inputs.version == '' }}
            type=raw,value=${{ steps.ver.outputs.full }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.mm }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - name: "Build and push Docker image"
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f #v7.1.0
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          context: .
          file: siglet/Dockerfile
          push: true
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: type=gha,scope=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Siglet Docker Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    needs:
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: "Derive version tags"
        id: ver
        if: ${{ inputs.version != '' }}
        run: |
          v='${{ inputs.version }}'
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "mm=${v%.*}" >> "$GITHUB_OUTPUT"

      - name: "Extract metadata"
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          # Two modes, discriminated by whether a version input was supplied (github.event_name
          # is unreliable here: in a workflow_call it reflects the CALLER's event, not 'workflow_call').
          #  - push/dispatch (no input): tags come from the git ref — dev on main, version from a siglet-v* tag.
          #  - workflow_call (version set): github.ref is the caller's (main), so version + latest
          #    come from inputs.version instead of the ref.
          tags: |
            type=raw,value=dev,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=match,pattern=siglet-v(\d+\.\d+\.\d+),group=1,enable=${{ inputs.version == '' }}
            type=match,pattern=siglet-v(\d+\.\d+),group=1,enable=${{ inputs.version == '' }}
            type=raw,value=${{ steps.ver.outputs.full }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.mm }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
