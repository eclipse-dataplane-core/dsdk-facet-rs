name: Release

# Publish-on-merge. Merging the release PR (see release-plz-prepare.yml) pushes to main —
# a human-attributed push, so this fires and publishes the just-bumped crates. `release`
# only needs GITHUB_TOKEN (contents: write) + CRATES_API_TOKEN, neither of which is affected
# by the org policy that forbids Actions from creating PRs. It is idempotent: pushes that
# don't bump a version publish nothing.

on:
  push:
    branches: ["main"]
  # Manual fallback to (re)publish whatever versions are currently committed on the branch.
  workflow_dispatch:

permissions:
  contents: write

# Never let two release runs (e.g. a merge landing during a manual dispatch) publish at once.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: mirrors rust.yml so we never publish from a red tree.
  test:
    name: Check, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --all-features --verbose

  release-plz:
    name: release-plz (release)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release-plz needs full history for changelog/tags

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
