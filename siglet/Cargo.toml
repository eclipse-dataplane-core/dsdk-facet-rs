[package]
name = "siglet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "siglet"
path = "src/main.rs"

[dependencies]
# Facet library crates
dsdk-facet-core = { path = "../crates/facet-core" , version = "0.1.0" }
dsdk-facet-postgres = { path = "../crates/facet-postgres", version = "0.1.0" }
dsdk-facet-hashicorp-vault = { path = "../crates/facet-hashicorp-vault", version = "0.1.0" }

# Eclipse Data Plane SDK
dataplane-sdk = "0.1.0"
dataplane-sdk-axum = "0.1.0"
dataplane-sdk-postgres = "0.1.0"

# Runtime dependencies
tokio = { workspace = true }
tokio-util = "0.7"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = "1.0"
config = "0.15"

# HTTP server
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
tower = { version = "0.5", features = ["util"] }
bon = { workspace = true }
chrono = { workspace = true }
hex = "0.4"
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
rand = "0.8"
reqwest = "0.12"
sqlx = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
dsdk-facet-core = { path = "../crates/facet-core", features = ["test-fixtures"] }
dsdk-facet-testcontainers = { path = "../crates/facet-testcontainers" }
ed25519-dalek = { workspace = true }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
wiremock = { workspace = true }

[lints]
workspace = true
